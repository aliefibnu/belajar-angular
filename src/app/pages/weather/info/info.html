<main class="w-screen min-h-screen pl-28 pt-24 pr-8 bg-emerald-50/50 -mt-18">
  @if (!data()?.current_condition) {
    <app-loader />
  } @else {
    <div
      class="current grid grid-cols-[repeat(5,minmax(75px,1fr))] auto-rows-[minmax(120px,auto)] gap-3"
    >
      <h1
        class="text-3xl font-bold py-4 bg-sky-400/5 rounded-lg shadow-md hover:shadow-lg duration-500 border border-gray-50 mb-5 col-span-full w-full flex items-center justify-center"
      >
        {{ `${city()} (${nearestArea()?.country?.[0]?.value})` }} -
        {{ currentCond()?.weatherDesc?.[0]?.value }}
      </h1>
      <div
        class="col-start-1 row-span-3 bg-white rounded-lg shadow-lg border border-gray-200 flex items-center justify-center flex-col"
      >
        <div class="top text-6xl text-gray-600 mb-5">
          <img
            [src]="currentCond()?.weatherIconUrl?.[0]?.value"
            alt=""
            class="h-40 aspect-square rounded-2xl shadow-2xl"
          />
        </div>
        <small class="text-gray-600 italic">Diamati Pada</small>
        <div class="text-2xl font-bold">{{ ubahWaktu(currentCond()?.observation_time ?? '') }}</div>
        <small class="text-gray-600 italic">{{
          'GMT ' + (timeZoneHour() >= 0 ? `+` : ``) + timeZoneHour()
        }}</small>
      </div>
      <card [cardData]="{ title: 'Suhu', value: `${currentCond()?.temp_C}°` }" class="col-span-2" />
      <card
        [cardData]="{ title: 'Terasa Seperti', value: `${currentCond()?.FeelsLikeC}°` }"
        class="col-span-2 col-start-4"
      />
      <card
        [cardData]="{ title: 'Indeks Uv', value: `${currentCond()?.uvIndex}` }"
        class="col-span-2"
      />
      <card
        [cardData]="{ title: 'Jarak Pandang', value: `${currentCond()?.visibility}km` }"
        class="col-span-2 col-start-4"
      />
      <card
        [cardData]="{ title: 'Arah Angin', value: `${currentCond()?.winddirDegree}°` }"
        class="col-span-2"
      >
        <ng-icon
          name="lucideCircleArrowUp"
          [style]="`rotate:${currentCond()?.winddirDegree}deg`"
          class="ml-3"
        />
      </card>
      <card
        [cardData]="{ title: 'Kecepatan Angin', value: `${currentCond()?.windspeedKmph}Km/h` }"
        class="col-span-2"
      />
    </div>
  }
</main>
