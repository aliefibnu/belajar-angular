<main>
  <!-- ASIDE / SIDEBAR -->
  <aside class="fixed left-0 top-0 h-screen w-fit pt-24 px-5 flex flex-col gap-5">
    <!-- MENU 1: WEATHER -->
    <a
      routerLink="/weather"
      routerLinkActive
      #weatherRla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      class="p-2 rounded-xl flex items-center justify-center flex-col duration-300 cursor-pointer border hover:border-indigo-700 hover:bg-indigo-200 hover:text-indigo-700"
      [ngClass]="
        weatherRla.isActive
          ? 'bg-indigo-200 text-indigo-700 border-indigo-700'
          : 'bg-indigo-500 text-white border-white/5'
      "
    >
      <ng-icon name="lucideCloudSun" class="text-2xl" />
      <p class="text-xs">Weather</p>
    </a>

    <!-- MENU 2: SEARCH -->
    <a
      routerLink="search"
      routerLinkActive
      #searchRla="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      class="p-2 rounded-xl flex items-center justify-center flex-col duration-300 cursor-pointer border hover:border-indigo-700 hover:bg-indigo-200 hover:text-indigo-700"
      [ngClass]="
        searchRla.isActive
          ? 'bg-indigo-200 text-indigo-700 border-indigo-700'
          : 'bg-indigo-500 text-white border-white/5'
      "
    >
      <ng-icon name="lucideSearch" class="text-2xl" />
      <p class="text-xs">Search</p>
    </a>
  </aside>

  <!-- CONTENT -->
  <router-outlet />
</main>
