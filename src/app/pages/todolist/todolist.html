<main
  class="w-screen min-h-screen flex items-center justify-center flex-col bg-gradient-to-br from-emerald-50 to-teal-100 p-6"
>
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-2xl border border-emerald-100">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-emerald-800 mb-1">Todo List</h1>
    </div>

    <form [formGroup]="formGroup" (ngSubmit)="formSubmit()" class="mb-6">
      <div
        class="flex items-center gap-0 bg-gray-50 rounded-xl border-2 border-emerald-200 focus-within:border-emerald-400 focus-within:bg-white transition-all overflow-hidden"
      >
        <input
          type="text"
          id="tugas"
          autofocus
          formControlName="tugas"
          placeholder="Makan, Minum, Tidur..."
          class="px-4 py-3 focus:outline-0 grow bg-transparent text-gray-700 placeholder-gray-400"
        />
        <button
          type="submit"
          class="px-6 py-3 bg-emerald-500 text-white font-medium hover:bg-emerald-600 active:scale-95 transition-all cursor-pointer flex items-center gap-1"
        >
          <span class="text-lg">+</span> Tambah
        </button>
      </div>
    </form>

    <div class="todos">
      <table class="w-full divide-y divide-emerald-100">
        <thead>
          <tr class="border-b border-emerald-200">
            <th
              class="pb-3 text-left text-xs font-semibold text-emerald-600 uppercase tracking-wider w-16"
            >
              <div class="flex items-center justify-center">
                <ng-icon
                  [name]="
                    doneTodos.length == todos().length
                      ? 'lucideCheckCircle'
                      : doneTodos.length === 0
                        ? 'lucideCircle'
                        : 'lucideCircleDotDashed'
                  "
                  class="cursor-pointer transition-all text-xl"
                  /* [class.text-emerald-500]="todo?.done"
                [class.text-gray-300]="!todo?.done" */
                  (click)="todoService.updateAllStatus()"
                />
              </div>
            </th>
            <th
              class="pb-3 text-left text-xs font-semibold text-emerald-600 uppercase tracking-wider"
            >
              Tugas
            </th>
            <th
              class="pb-3 text-center text-xs font-semibold text-emerald-600 uppercase tracking-wider w-24"
            >
              Aksi
              <button
                class="p-1.5 rounded-lg text-red-400 hover:bg-red-50 hover:text-red-600 transition-all cursor-pointer"
                title="Hapus"
                (click)="todoService.delete('all')"
              >
                <ng-icon name="lucideTrash2" class="text-lg" />
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          @for (todo of todos(); track todo.id) {
            <tr class="border-b border-emerald-100 hover:bg-emerald-50/50 transition-colors">
              <td class="py-3 text-center">
                <ng-icon
                  [name]="todo?.done ? 'lucideCheckCircle' : 'lucideCircle'"
                  class="cursor-pointer transition-all text-xl"
                  [class.text-emerald-500]="todo?.done"
                  [class.text-gray-300]="!todo?.done"
                  [class.hover:text-emerald-600]="todo?.done"
                  [class.hover:text-gray-400]="!todo?.done"
                  (click)="updateStatus(todo)"
                />
              </td>

              <td class="py-3">
                <p
                  class="text-gray-700 transition-all"
                  [class.line-through]="todo?.done"
                  [class.text-gray-400]="todo?.done"
                >
                  {{ todo.value }}
                </p>
              </td>

              <td class="py-3">
                <div class="flex items-center justify-center gap-2">
                  <button
                    class="p-1.5 rounded-lg text-amber-500 hover:bg-amber-50 hover:text-amber-600 transition-all cursor-pointer"
                    title="Edit"
                    (click)="todoService.update(todo)"
                  >
                    <ng-icon name="lucidePencil" class="text-lg" />
                  </button>
                  <button
                    class="p-1.5 rounded-lg text-red-400 hover:bg-red-50 hover:text-red-600 transition-all cursor-pointer"
                    title="Hapus"
                    (click)="todoService.delete(todo.id)"
                  >
                    <ng-icon name="lucideTrash2" class="text-lg" />
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="py-12 text-center">
                <div class="text-5xl mb-3">📭</div>
                <p class="text-gray-400 text-sm">Belum ada tugas. Yuk tambah!</p>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    @if (todos().length > 0) {
      <div
        class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500"
      >
        <span>
          {{ todos().length - doneTodos.length }} aktif • {{ doneTodos.length }} selesai
        </span>
        <span class="text-gray-400"> {{ todos().length }} total </span>
      </div>
    }
  </div>
</main>
