<div class="min-h-screen bg-linear-to-br from-blue-50 via-white to-indigo-50 flex flex-col">
  <div class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-xl shadow-blue-100/50 overflow-hidden">
        <div class="bg-linear-to-r from-blue-600 to-indigo-600 p-8 py-5 text-white text-center">
          <h2 class="text-3xl font-bold">Selamat Datang</h2>
        </div>

        <div class="p-8">
          <div class="space-y-4">
            <a
              routerLink="/auth/login"
              class="group relative w-full flex items-center gap-4 px-6 py-4 bg-white border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-100 transition-all duration-300 cursor-pointer"
            >
              <div
                class="shrink-0 w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center group-hover:bg-blue-100 transition-colors"
              >
                <ng-icon name="lucideLogIn" class="text-2xl text-blue-600"></ng-icon>
              </div>
              <div class="flex-1 text-left">
                <h3 class="font-semibold text-gray-900 group-hover:text-blue-600 transition-colors">
                  Masuk
                </h3>
                <p class="text-sm text-gray-500">Sudah punya akun? Masuk sekarang</p>
              </div>
              <div
                class="text-gray-400 group-hover:text-blue-600 group-hover:translate-x-1 transition-all"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </div>
            </a>

            <a
              routerLink="/auth/signup"
              class="group relative w-full flex items-center gap-4 px-6 py-4 bg-white border-2 border-gray-200 rounded-xl hover:border-indigo-500 hover:shadow-lg hover:shadow-indigo-100 transition-all duration-300 cursor-pointer"
            >
              <div
                class="shrink-0 w-12 h-12 bg-indigo-50 rounded-lg flex items-center justify-center group-hover:bg-indigo-100 transition-colors"
              >
                <ng-icon name="lucideUserPlus" class="text-2xl text-indigo-600"></ng-icon>
              </div>
              <div class="flex-1 text-left">
                <h3
                  class="font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors"
                >
                  Daftar
                </h3>
                <p class="text-sm text-gray-500">Buat akun baru untuk memulai</p>
              </div>
              <div
                class="text-gray-400 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
