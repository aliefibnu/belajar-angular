<div
  class="group relative p-2.5 text-2xl rounded-full bg-linear-to-br from-amber-400 to-amber-600 flex shadow-md hover:shadow-xl text-white hover:text-gray-200 duration-300 hover:bg-linear-to-br hover:from-gray-100 hover:to-gray-200 cursor-pointer transition-all ease-in-out"
>
  <ng-icon name="lucideUserCircle2" class="drop-shadow-sm" />
  <div
    class="absolute p-1.5 top-full left-1/2 -translate-x-1/2 mt-3 text-sm bg-white/80 backdrop-blur-lg shadow-xl border border-gray-200/60 text-gray-700 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 ease-out min-w-37.5 z-10"
  >
    <div
      class="absolute -top-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-white/80 backdrop-blur-lg border-l border-t border-gray-200/60 rotate-45"
    ></div>

    @if (user()) {
      @for (route of routes.user; track $index) {
        <a
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-amber-50 cursor-pointer transition-colors duration-200 group/item"
          [routerLink]="
            route.split(':')[1].includes(' ') ? null : 'auth/' + route.split(':')[1].toLowerCase()
          "
        >
          <ng-icon
            [name]="route.split(':')[0]"
            class="text-amber-500 group-hover/item:text-amber-600 transition-colors"
          />
          <span class="font-medium">{{ route.split(':')[1] }}</span>
        </a>
        <div class="my-1 border-t border-gray-200/80"></div>
      }
    }
  </div>
</div>
