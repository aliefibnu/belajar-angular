<main class="w-screen min-h-screen items-center flex flex-col pt-6 bg-zinc-100">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-4xl border border-emerald-100 h-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-emerald-800 mb-1">Cari Area</h1>
    </div>

    <form
      class="flex items-center gap-0 bg-gray-50 rounded-xl border-2 border-emerald-200 focus-within:border-emerald-400 focus-within:bg-white transition-all overflow-hidden"
      [formGroup]="formControlGroup"
      (submit)="onSubmit()"
    >
      <input
        type="text"
        id="tugas"
        autofocus
        formControlName="search"
        placeholder="India, Indonesia, America, China..."
        class="px-4 py-3 focus:outline-0 grow bg-transparent text-gray-700 placeholder-gray-400"
      />
      <button
        type="submit"
        class="px-6 py-3 bg-emerald-500 text-white font-medium hover:bg-emerald-600 active:scale-95 transition-all cursor-pointer flex items-center gap-1"
      >
        <ng-icon name="lucideSearch" /> Cari
      </button>
    </form>
  </div>

  <div class="w-4xl grid grid-col-2"></div>
</main>
