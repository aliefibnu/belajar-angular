@if (thisItem()) {
  <main class="flex items-center justify-center w-screen min-h-screen bg-gray-50">
    <form
      [formGroup]="formGroup"
      (ngSubmit)="onSubmit()"
      class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"
    >
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Form Item</h1>

      <div class="mb-4">
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name : </label>
        <input
          type="text"
          name="name"
          id="name"
          formControlName="name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div class="mb-6">
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1"
          >Description :
        </label>
        <input
          type="text"
          name="description"
          id="description"
          formControlName="description"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>
      <div class="mb-6">
        <p class="block text-sm font-medium text-gray-700 mb-1">Image :</p>

        <label
          for="image"
          class="w-full h-40 block bg-contain bg-no-repeat bg-center rounded-lg border border-gray-300 cursor-pointer duration-300 hover:shadow-lg relative"
          [style.backgroundImage]="`url(${previewUrl()})`"
        >
          @if (!previewUrl()) {
            <div class="w-full h-full flex items-center justify-center text-gray-300 flex-col">
              <ng-icon name="lucideUpload" class="text-6xl" />
              <small class="text-gray-500">Anda Bisa Mengupload Gambar Disini.</small>
            </div>
          } @else {
            <button
              class="absolute z-50 top-2 right-2 bg-red-400 hover:bg-red-300 duration-300 text-white p-2 aspect-square rounded-full cursor-pointer"
              type="button"
              (click)="resetImage($event)"
            >
              X
            </button>
          }
        </label>
        <input
          type="file"
          name="image"
          accept="image/*"
          id="image"
          class="hidden"
          (change)="onFileChange($event)"
        />
        @if (formGroup.get('image')?.value) {
          <i class="text-sm text-gray-500">
            {{ fileName() }}
            @if (formGroup.get('image')?.value) {
              {{ `(${fileSize(formGroup.get('image')?.value ?? null)})` }}
            }
          </i>
        }
      </div>

      <div class="w-full flex items-center justify-baseline gap-5">
        <button
          type="button"
          class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 flex items-center justify-center cursor-pointer gap-5"
          (click)="router.navigate(['items'])"
        >
          <ng-icon name="lucideArrowLeftFromLine" />
          Kembali
        </button>
        <button
          type="submit"
          class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 flex items-center justify-center cursor-pointer gap-5"
        >
          Submit
          <ng-icon name="lucideSend" />
        </button>
      </div>
    </form>
  </main>
} @else {
  <app-loader />
}
