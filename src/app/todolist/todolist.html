<main>
  <h1>Todo List</h1>
  <form class="" [formGroup]="formGroup" (ngSubmit)="formSubmit()">
    <label for="tugas">Masukkan Tugas Baru</label>
    <div class="flex items-center justify-center border border-amber-200 rounded-md w-fit">
      <input type="text" class="px-2.5 py-1.5 focus:outline-0" id="tugas" formControlName="tugas" />
      <button
        class="px-2.5 py-1.5 bg-amber-200 cursor-pointer hover:bg-amber-100 transition-all duration-300"
        type="submit"
      >
        Tambah +
      </button>
    </div>
  </form>
  <div class="todos">
    <h1>Daftar Todos</h1>
    <ol>
      @for (todo of todos(); track todo.id) {
        <li>
          {{ `${$index + 1}. ${todo.value} - ${todo?.done ? 'selesai' : 'belum'}` }}
        </li>
      }
    </ol>
  </div>
</main>
