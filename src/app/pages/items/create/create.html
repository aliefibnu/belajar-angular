<main class="flex items-center justify-center w-screen min-h-screen bg-gray-50">
  <form
    [formGroup]="formGroup"
    (ngSubmit)="onSubmit()"
    class="bg-white p-8 rounded-lg shadow-md w-full max-w-md"
  >
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Form Item</h1>

    <div class="mb-4">
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name : </label>
      <input
        type="text"
        name="name"
        id="name"
        formControlName="name"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
      />
    </div>

    <div class="mb-6">
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1"
        >Description :
      </label>
      <input
        type="text"
        name="description"
        id="description"
        formControlName="description"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
      />
    </div>

    <div class="mb-6 w-full">
      <p class="block text-sm font-medium text-gray-700 mb-2">Image :</p>

      <label
        for="image"
        class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors duration-200"
      >
        @if (!previewUrl()) {
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <ng-icon name="lucideImage" class="w-10 h-10 text-gray-400 mb-3" />
            <p class="mb-2 text-sm text-gray-500">
              <span class="font-semibold">Click to upload</span>
            </p>
            <p class="text-xs text-gray-400">PNG, JPG, GIF (Max. 5MB)</p>
          </div>
        }

        @if (previewUrl()) {
          <div class="relative w-full h-full p-2">
            <img
              [src]="previewUrl()"
              alt="Preview"
              class="w-full h-full object-contain rounded-lg"
            />
            <button
              type="button"
              (click)="removeImage($event)"
              class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 transition-colors duration-200"
            >
              <ng-icon name="lucideX" class="w-4 h-4" />
            </button>
          </div>
        }

        <input
          type="file"
          accept="image/*"
          name="image"
          id="image"
          (change)="onFileSelected($event)"
          class="hidden"
        />
      </label>

      @if (selectedFile()) {
        <div
          class="mt-2 flex items-center justify-between text-sm text-gray-600 bg-gray-50 rounded-md p-2"
        >
          <div class="flex items-center gap-2">
            <ng-icon name="lucideFileImage" class="w-4 h-4 text-indigo-500" />
            <span class="truncate max-w-50">{{ selectedFile()?.name }}</span>
          </div>
          <span class="text-xs text-gray-400">{{ formatFileSize(selectedFile()?.size || 0) }}</span>
        </div>
      }
    </div>

    <div class="w-full flex items-center justify-baseline gap-5">
      <button
        type="button"
        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 flex items-center justify-center cursor-pointer gap-5"
        (click)="router.navigate(['items'])"
      >
        <ng-icon name="lucideArrowLeftFromLine" />
        Kembali
      </button>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200 flex items-center justify-center cursor-pointer gap-5"
      >
        Submit
        <ng-icon name="lucideSend" />
      </button>
    </div>
  </form>
</main>
