<main
  class="h-screen w-screen flex items-center justify-center flex-col bg-linear-to-br from-slate-100 to-blue-50 gap-6"
>
  <div
    class="bg-white rounded-2xl shadow-lg p-12 flex flex-col items-center gap-6 border border-gray-100"
  >
    <div class="text-center">
      <p class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-2">Counter</p>
      <h1 class="text-6xl font-bold text-gray-800 tabular-nums">{{ count() }}</h1>
    </div>

    <div class="w-16 h-px bg-gray-200"></div>

    <div class="text-center">
      <p class="text-sm font-medium text-blue-400 uppercase tracking-wider mb-2">Double</p>
      <h1 class="text-5xl font-semibold text-blue-600 tabular-nums">{{ double() }}</h1>
    </div>

    <div class="btns flex gap-3 mt-6">
      <app-custom-button type="failure" (onClick)="reset()" text="Reset" />
      <app-custom-button type="warning" (onClick)="kurangi()" text="Kurangi" />
      <app-custom-button type="success" (onClick)="increment()" text="Tambah" />
      <app-custom-button type="info" (onClick)="dobel()" text="Dobelin" />
    </div>
  </div>
</main>
