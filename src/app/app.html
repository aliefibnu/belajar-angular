<main class="h-screen w-screen flex items-center justify-center flex-col">
  <h1>{{ count() }}</h1>
  <h1>{{ double() }}</h1>
  <div class="btns">
    <button class="mr-6 bg-amber-200 border rounded-md px-3 cursor-pointer" (click)="dobel()">
      Dobel
    </button>
    <button class="bg-cyan-200 border rounded-md px-3 cursor-pointer" (click)="increment()">
      Tambah
    </button>
  </div>
</main>
