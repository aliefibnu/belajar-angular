@if (router.url.endsWith('/items')) {
  <div class="px-20 mt-5">
    <div
      class="mx-auto px-4 sm:px-6 lg:px-8 py-6 bg-white shadow-sm border-b border-gray-200 rounded-2xl"
    >
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Daftar Items</h1>
        </div>
        <button
          class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
          (click)="navigateToCreate()"
        >
          <ng-icon name="lucidePlus" />
          Tambah Item
        </button>
      </div>
    </div>
  </div>
}
<router-outlet />
